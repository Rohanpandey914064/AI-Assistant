# ============================================================
# Sentinel-Agent: Docker Compose
# ============================================================
version: "3.9"

services:
  sentinel-agent:
    build: .
    container_name: sentinel-agent
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./database:/app/database    # Persist SQLite data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
