# ============================================================
# Sentinel-Agent: CI/CD Pipeline
# ============================================================
name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Gate 1 tests
        run: pytest tests/test_gate1.py -v

      - name: Run Tool tests
        run: pytest tests/test_tools.py -v

      - name: Run Agent tests
        run: pytest tests/test_agent.py -v

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sentinel-agent:latest .

      - name: Verify health endpoint
        run: |
          docker run -d --name test-agent -p 8000:8000 \
            -e OPENAI_API_KEY=sk-placeholder \
            sentinel-agent:latest
          sleep 5
          curl -f http://localhost:8000/health || exit 1
          docker stop test-agent
